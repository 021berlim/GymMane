name: Build & Release

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag / version, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write

# Pinned Flutter version. Defined once here and reused.
env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build:
    name: Build split APKs
    runs-on: ubuntu-latest

    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Reproducibility: force --build-id=none for libdartjni.so
      - name: Patch jni build-id
        run: |
          if [ -d "$PUB_CACHE/hosted/pub.dev" ]; then
            find "$PUB_CACHE/hosted/pub.dev" -path "*/jni-*/src/CMakeLists.txt" -exec sed -i -e 's/-Wl,/-Wl,--build-id=none,/' {} + || true
          fi

      # Configure signing if secrets are present
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d -i > android/app/fitiron-release.jks
            if [ -s android/app/fitiron-release.jks ]; then
              echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
              echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
              echo "keyAlias=$KEY_ALIAS" >> android/key.properties
              echo "storeFile=fitiron-release.jks" >> android/key.properties
            fi
          fi

      # ABI splits keep each APK small instead of one fat APK.
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     FitIron-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   FitIron-armeabi-v7a.apk
          mv app-x86_64-release.apk        FitIron-x86_64.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v5
        with:
          name: fitiron-apks
          path: build/app/outputs/flutter-apk/FitIron-*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Download built APKs
        uses: actions/download-artifact@v5
        with:
          name: fitiron-apks
          path: apks

      # Clean source archive straight from the git tree (no build artifacts).
      - name: Package source code
        run: git archive --format=zip --prefix=fitiron-${{ steps.tag.outputs.value }}/ -o FitIron-source-${{ steps.tag.outputs.value }}.zip HEAD

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: FitIron ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            apks/FitIron-arm64-v8a.apk
            apks/FitIron-armeabi-v7a.apk
            apks/FitIron-x86_64.apk
            FitIron-source-${{ steps.tag.outputs.value }}.zip
